name: Check prices and publish dashboard

on:
  schedule:
    - cron: "23 */6 * * *"          # every 6 hours (UTC)
  workflow_dispatch:                 # "Check now" / "Send test notification" in the dashboard, or the Actions tab
    inputs:
      test_push:
        description: "Send a test notification to the phone instead of checking prices"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["ui/**", "watcher/**", "requirements.txt", ".github/workflows/check.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Check prices
        working-directory: watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}       # phone notifications; set it under Settings -> Secrets -> Actions
          PLANNER_URL: ${{ secrets.PLANNER_URL }}     # optional: overrides ship / sail_date from config.json
        run: python watch.py ${{ inputs.test_push && '--test-push' || '' }}

      - name: Commit price data
        if: ${{ !inputs.test_push }}
        run: |
          git config user.name "price-watch bot"
          git config user.email "actions@users.noreply.github.com"
          git add data config.json
          git commit -m "prices $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "nothing to commit"
          git pull --rebase -X theirs origin main
          git push

      - uses: actions/setup-node@v4
        if: ${{ !inputs.test_push }}
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build dashboard
        if: ${{ !inputs.test_push }}
        working-directory: ui
        run: npm ci && npm run build
      - name: Export data for the dashboard
        if: ${{ !inputs.test_push }}
        working-directory: watcher
        env:
          BOOKING_ID: ${{ secrets.BOOKING_ID }}       # baked into the site so product links work; not in the repo
        run: python export.py ../ui/dist

      - uses: actions/configure-pages@v5
        if: ${{ !inputs.test_push }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.test_push }}
        with:
          path: ui/dist
      - id: deploy
        if: ${{ !inputs.test_push }}
        uses: actions/deploy-pages@v4
